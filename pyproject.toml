[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "allocation-ope-bench"
version = "0.1.0"
description = "Reproducible benchmark for offline evaluation of budget-constrained allocation policies"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.1,<3.0",
    "scikit-learn>=1.4,<2.0",
    "lightgbm>=4.3,<5.0",
    "hydra-core>=1.3,<2.0",
    "omegaconf>=2.3,<3.0",
    "matplotlib>=3.8,<4.0",
    "scipy>=1.12,<2.0",
    "pyarrow>=15.0,<19.0",
    "scikit-uplift>=0.5,<1.0",
    "joblib>=1.3,<2.0",
]

[project.optional-dependencies]
obp = [
    # obp 0.5.x requires Python <3.11; install manually with --ignore-requires-python
    # pip install obp==0.5.7 --ignore-requires-python
    # Needed for WP1 OBP synthetic dataset generator.
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not network'"
markers = [
    "network: tests that require network/downloaded data (deselect with -m 'not network')",
    "slow: tests that take >60s (deselect with -m 'not slow')",
]
