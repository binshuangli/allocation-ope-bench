# Expanded-slate policy-selection experiment (review item 7).
# Seven candidates: five real uplift learners + class transformation (binary
# outcomes only; skipped gracefully elsewhere) + the random baseline, so
# correct-selection is no longer "two learners vs an easy random straw man".
n_seeds: 10
budgets: [0.1, 0.3, 0.5]
overlap_temperatures: [0.5, 2.0, 5.0]
candidate_policies:
  [t_learner, s_learner, x_learner, r_learner, dr_learner, class_transformation, random]
